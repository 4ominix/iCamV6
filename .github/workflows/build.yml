name: Build VCam Pro RootHide DEB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web GitHub

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup System Tools (dpkg, ldid)
        run: |
          brew install dpkg ldid

      - name: Setup Theos Environment
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS 16.5 SDK for Theos
        run: |
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $HOME/theos/sdks/
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Compile and Package RootHide / Rootless DEB
        run: |
          export THEOS=$HOME/theos
          export THEOS_PACKAGE_SCHEME=rootless
          export TARGET=iphone:clang:latest:15.0
          export ARCHS="arm64 arm64e"
          
          # Biên dịch toàn bộ các module và đóng gói DEB
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCam-Pro-iOS15-Dopamine-RootHide
          path: packages/*.deb
          if-no-files-found: error
